# For a classic ESP32 development board and an SHT31-D breakout at I2C address 0x44.
# This is for a NEW, separate sensor. Do not flash it onto the supplied CB3S device.
esphome:
  name: tempmox-sensor
  friendly_name: TempmoX Sensor

esp32:
  variant: esp32
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: sht3xd
    address: 0x44
    update_interval: 30s
    temperature:
      name: Room Temperature
    humidity:
      name: Room Humidity

web_server:
  port: 80
  local: true
  auth:
    type: basic
    username: !secret web_username
    password: !secret web_password
